<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#F3F6F9">
<title>Budapest 3D Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Identity: night cartography. Flat ink panels, hairline rules, Frank Ruhl serif for names,
   a metro-line motif (stations on a mint line) for every sequence: loading, route, plan. */
.maplibregl-map{font:12px/20px Helvetica,Arial,sans-serif;overflow:hidden;position:relative;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab;user-select:none}
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate,.maplibregl-canvas-container.maplibregl-touch-zoom-rotate .maplibregl-canvas{touch-action:pan-x pan-y}
.maplibregl-canvas-container.maplibregl-touch-drag-pan,.maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas{touch-action:pinch-zoom}
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas{touch-action:none}
.maplibregl-ctrl-bottom-right{position:absolute;pointer-events:none;z-index:2;bottom:0;right:0}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl{float:right;margin:0 0 0 10px}
.maplibregl-ctrl{clear:both;pointer-events:auto;transform:translate(0)}
.maplibregl-ctrl-attrib{padding:0 6px;font-size:11px}.maplibregl-ctrl-attrib a{text-decoration:none}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
:root{--ink:#F3F6F9;--panel:#FFFFFF;--panel2:#E9EFF5;--rule:#D3DDE8;--paper:#0F1B2A;--mute:#566A82;--gold:#A96A00;--mint:#0A8A6E;--bad:#C93A2A;--glass:rgba(255,255,255,.95);--body:#2B3B50;--onmint:#fff;--ongold:#fff;--phbg:hsl(var(--h) 60% 90%);--phfg:hsl(var(--h) 55% 32%);--toastbtn:#5EE7C4;color-scheme:light;
 --serif:'Frank Ruhl Libre','Times New Roman',serif;--sans:'Heebo',system-ui,sans-serif;--r:3px;--sh:0px;--safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--ink:#0D1620;--panel:#121D2A;--panel2:#192A3E;--rule:#25374B;--paper:#EDEFF3;--mute:#8FA3BA;--gold:#F1C777;--mint:#5EE7C4;--bad:#FF8F80;--glass:rgba(13,22,32,.94);--body:#d5dce6;--onmint:#04241c;--ongold:#1a1405;--phbg:hsl(var(--h) 28% 20%);--phfg:hsl(var(--h) 60% 75%);--toastbtn:#0a6a56;color-scheme:dark}
#intro{--ink:#0D1620;--panel:#121D2A;--rule:#25374B;--paper:#EDEFF3;--mute:#8FA3BA;--gold:#F1C777;--mint:#5EE7C4;--onmint:#04241c;color:#EDEFF3}
.dh h2,.dh .alt,.dh .back{color:#fff}.btn.danger{color:#fff}.pin.k{background:#59A8FF;box-shadow:0 0 0 1.5px #59A8FF,0 4px 12px rgba(0,0,0,.45)}.pin.h{background:#FF6FA8;box-shadow:0 0 0 1.5px #FF6FA8,0 4px 12px rgba(0,0,0,.45)}.pin.h.sel{background:var(--paper)}.pin.h.dest{background:var(--mint)}
.pin.k.sel{background:var(--paper)}.pin.k.dest{background:var(--mint)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:16px;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#map{position:fixed;inset:0}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--sh) + 2px)}
.maplibregl-ctrl-attrib{background:var(--glass)!important;color:var(--mute)!important}.maplibregl-ctrl-attrib a{color:var(--mute)!important}
.lc,svg.lucide{width:1.15em;height:1.15em;vertical-align:-.2em;stroke:currentColor;fill:none;flex:none}
/* top bar */
#top{position:fixed;z-index:20;inset-inline:0;top:0;padding-top:var(--safeT);background:var(--glass);border-bottom:1px solid var(--rule)}
.search{display:flex;align-items:center;gap:10px;height:48px;padding-inline:16px;border-bottom:1px solid var(--rule)}
.search svg{width:20px;height:20px;stroke:var(--gold)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--paper);font:500 17px var(--sans);height:100%;outline:none}
.search input::placeholder{color:var(--mute)}
#qx{width:32px;height:32px;display:grid;place-items:center;color:var(--mute)}#qx svg{width:18px;height:18px}
#chips{display:flex;gap:22px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:11px 0 9px;font-size:14px;font-weight:500;color:var(--mute);white-space:nowrap;border-bottom:2px solid transparent}
.chip[aria-pressed=true]{color:var(--paper);border-bottom-color:var(--gold)}
/* fabs */
#fabs{position:fixed;z-index:25;inset-inline-end:12px;bottom:calc(var(--sh) + 14px);display:flex;flex-direction:column;gap:8px;transition:bottom .35s,opacity .2s}
body[data-snap=full] #fabs{opacity:0;pointer-events:none}
.fab{width:46px;height:46px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.fab svg{width:21px;height:21px;stroke:var(--paper);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab:active,.btn:active{scale:.97}
/* sheet */
#sheet{position:fixed;z-index:30;inset-inline:0;bottom:0;height:50vh;background:var(--panel);border-top:1px solid var(--rule);display:flex;flex-direction:column;transition:height .35s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safeB);box-shadow:0 -14px 40px rgba(0,0,0,.45)}
#handle{height:20px;width:100%;display:grid;place-items:center;flex:none}#handle i{width:38px;height:3px;background:var(--rule);display:block}
#tabs{display:flex;border-bottom:1px solid var(--rule);flex:none}
.tab{flex:1;padding:8px 4px 9px;font-size:12.5px;font-weight:500;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab svg{width:20px;height:20px}
.tab[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
#view{flex:1;overflow-y:auto;padding:0 16px 32px;-webkit-overflow-scrolling:touch}
/* type */
h2{font:700 30px/1.1 var(--serif);margin:18px 0 14px;text-wrap:balance}
h3{display:flex;align-items:center;gap:8px;margin:28px 0 10px;padding-top:12px;border-top:1px solid var(--rule);font:600 13.5px/1 var(--sans);color:var(--mute)}
p{line-height:1.65;margin:0 0 12px;color:var(--body)}
p.lead{font:400 18.5px/1.75 var(--serif);color:var(--paper)}
/* list rows */
.it{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule)}
.im{flex:1;display:flex;gap:14px;align-items:center;text-align:start;min-width:0;padding:14px 0}
.th{width:62px;height:62px;flex:none;object-fit:cover;background:var(--panel2);border-radius:2px;display:block}
.th.ph{display:grid;place-items:center;background:var(--phbg);color:var(--phfg)}.th.ph svg{width:26px;height:26px}
.tx2{display:block;min-width:0}
.nm{display:block;font:700 21px/1.15 var(--serif)}
.sb{display:block;color:var(--mute);font-size:13px;margin-top:3px;line-height:1.4}
.ds{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600}
.fv{width:42px;height:48px;display:grid;place-items:center;color:var(--mute);flex:none}.fv svg{width:22px;height:22px}
.fv[aria-pressed=true] svg,.btn[aria-pressed=true] svg{fill:#ff7b8f;stroke:#ff7b8f}
.empty{text-align:center;color:var(--mute);padding:48px 12px;line-height:1.6}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--rule);border-top-color:var(--mint);margin:0 auto;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 20px;border-radius:var(--r);font-weight:700;font-size:16px;border:1px solid var(--rule);color:var(--paper)}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--mint);color:var(--onmint);border-color:var(--mint)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.danger{background:#7a2433;border-color:#7a2433}
.btn.full{width:100%}.btn.sm{min-height:42px;padding:0 14px;font-size:14.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.row>.btn{flex:1}
.row2{display:flex;gap:8px;margin:2px 0 16px}.row2 .btn{flex:1;min-height:44px;font-size:15px}
.acts{display:flex;justify-content:space-between;margin:6px 0 0;border-bottom:1px solid var(--rule)}
.acts button,.acts a{flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:14.5px;text-decoration:none}
.acts svg{width:19px;height:19px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-weight:500;min-height:44px}
[dir=rtl] .back svg{transform:scaleX(-1)}
/* detail */
.dh{position:relative;margin:0 -16px;height:250px;background:linear-gradient(160deg,hsl(var(--h) 35% 30%),hsl(var(--h) 40% 16%));display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.dh .himg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dh::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,22,32,.45),rgba(13,22,32,0) 38%,rgba(13,22,32,.95));pointer-events:none}
.dh .ghost{position:absolute;inset-inline-end:-6px;top:34px;color:#fff;opacity:.08}.dh .ghost svg{width:180px;height:180px;stroke-width:1}
.dh .back{position:absolute;z-index:2;top:10px;inset-inline-start:10px;background:rgba(13,22,32,.72);padding:0 14px 0 10px;border-radius:var(--r);min-height:40px}
.dh .dt{position:relative;z-index:2;padding:0 16px 14px}
.dh h2{margin:0;font-size:34px}
.dh .alt{color:#cfd8e4;font-size:14px;margin-top:6px}
.dh .cr{position:absolute;z-index:2;top:14px;inset-inline-end:12px;font-size:11px;color:#dfe6ee;display:none}.dh.hasimg .cr{display:block}
.dpad{padding-top:16px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;margin:14px 0 4px;font-size:15px}
.facts dt{color:var(--mute)}.facts dd{margin:0;font-variant-numeric:tabular-nums}
ul.f{padding-inline-start:20px;margin:0 0 8px;line-height:1.75;color:var(--body)}
.note{border-inline-start:3px solid var(--gold);padding:10px 14px;background:var(--panel2);font-size:13.5px;color:var(--body);margin:18px 0;line-height:1.6}
/* summary + metro line */
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);align-items:center}
.badge{display:inline-flex;gap:7px;align-items:center;color:var(--mint);font-weight:600}.badge::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}.badge.w{color:var(--gold)}
.sum{display:flex;gap:34px;margin:16px 0 6px}
.sum b{display:block;font:700 46px/1 var(--serif);font-variant-numeric:tabular-nums}.sum small{color:var(--mute);font-size:13px}
.mline{margin:12px 0 4px}
.stn{position:relative;padding-inline-start:38px;padding-bottom:20px;min-height:44px}
.stn::before{content:'';position:absolute;inset-inline-start:11px;top:16px;bottom:-4px;width:4px;background:var(--mint);border-radius:2px}
.stn:last-child{padding-bottom:4px}.stn:last-child::before{display:none}
.stn::after{content:'';position:absolute;inset-inline-start:5px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:4px solid var(--mint)}
.stn.end::after{border-color:var(--gold)}
.stn .nm2{font:700 20px/1.2 var(--serif);padding-top:2px;padding-inline-end:140px}
.stn .lg{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:13.5px;margin-top:8px;font-variant-numeric:tabular-nums}.stn .lg svg{width:15px;height:15px}
.stn .sub{color:var(--mute);font-size:13px;margin-top:3px}
.stn .ctl{position:absolute;inset-inline-end:0;top:-2px;display:flex;gap:6px}
.mini{width:38px;height:38px;display:grid;place-items:center;color:var(--paper);border:1px solid var(--rule);border-radius:var(--r)}.mini svg{width:17px;height:17px}.mini[disabled]{opacity:.3}
.stn select{margin-top:8px}
.step{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule);width:100%;text-align:start}
.step .ar{width:38px;height:38px;border:1px solid var(--rule);display:grid;place-items:center;flex:none;border-radius:var(--r)}
.step svg{width:21px;height:21px;fill:var(--paper)}
.step b{display:block;font-size:15.5px;font-weight:500;line-height:1.35}.step small{color:var(--mute);font-variant-numeric:tabular-nums}
/* forms + settings */
select,input.txt{width:100%;min-height:48px;background:var(--panel2);color:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:0 12px;font:inherit;font-size:16px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.seg{display:flex}.seg button{padding:9px 15px;border:1px solid var(--rule);margin-inline-start:-1px;font-weight:600;color:var(--mute);font-size:14.5px}
.seg button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ongold)}
.chk{display:flex;gap:10px;padding:9px 0;font-size:14.5px;line-height:1.5}.chk i{font-style:normal;flex:none;width:22px}
/* map markers */
.pw{width:26px;height:26px;position:relative}
.pin{position:absolute;inset:0;border-radius:50%;background:var(--gold);border:3px solid var(--ink);box-shadow:0 0 0 1.5px var(--gold),0 4px 12px rgba(0,0,0,.55);transition:transform .3s cubic-bezier(.2,.9,.3,1.3),background .2s}
.pin::after{content:'';position:absolute;inset:-10px}
.pin.sel{transform:scale(1.5);background:var(--paper);z-index:5}
.pin.dest{background:var(--mint);box-shadow:0 0 0 1.5px var(--mint),0 4px 12px rgba(0,0,0,.55)}
.pin.in{animation:pop .6s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:var(--d,0ms)}
@keyframes pop{from{transform:scale(0);opacity:0}}
.pl{position:absolute;top:30px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12.5px var(--sans);color:var(--paper);text-shadow:0 0 3px var(--ink),0 0 3px var(--ink),0 0 7px var(--ink);display:none;pointer-events:none}
.z-lbl .pl{display:block}
.mk{width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--onmint);font-weight:800;display:grid;place-items:center;border:3px solid var(--ink)}
.me{width:22px;height:22px;border-radius:50%;background:#4aa3ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(74,163,255,.25);position:relative}
.me .cone{position:absolute;left:50%;top:50%;width:0;height:0;margin:-34px 0 0 -12px;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:26px solid rgba(74,163,255,.5);transform-origin:12px 34px;display:none}
.me.h .cone{display:block}.me.sim{background:#c084fc;box-shadow:0 0 0 6px rgba(192,132,252,.3)}
/* navigation */
#hud[hidden],#navbar[hidden],#sug[hidden],#modal[hidden]{display:none}
#hud{position:fixed;z-index:35;inset-inline:0;top:0;padding-top:var(--safeT);background:var(--ink);border-bottom:1px solid var(--rule);display:flex;align-items:stretch;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#hud .big{width:88px;flex:none;background:var(--mint);display:grid;place-items:center}
#hud .big svg{width:50px;height:50px;fill:var(--onmint)}
#hud .tt{padding:12px 16px;min-width:0}
#hud .d{font:700 48px/1 var(--serif);font-variant-numeric:tabular-nums}
#hud .tx{font-size:19px;font-weight:600;margin-top:5px;line-height:1.25}
#hud .nx{font-size:13.5px;color:var(--mute);margin-top:5px}
#banner{position:fixed;z-index:34;inset-inline:0;top:var(--bt,calc(88px + var(--safeT)));display:flex;flex-direction:column;pointer-events:none}
#banner div{pointer-events:auto;background:var(--panel2);border-inline-start:4px solid var(--gold);color:var(--paper);padding:10px 16px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--rule)}
#banner .err{border-inline-start-color:var(--bad)}#banner .demo{border-inline-start-color:#c084fc}
#banner button{border:1px solid var(--rule);padding:4px 12px;border-radius:var(--r)}
#navbar{position:fixed;z-index:35;inset-inline:0;bottom:0;background:var(--ink);border-top:1px solid var(--rule);padding:0 16px calc(12px + var(--safeB));box-shadow:0 -10px 34px rgba(0,0,0,.5)}
.prog{height:4px;background:var(--rule);margin:0 -16px 12px;position:relative}.prog i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--mint);width:0;transition:width .6s}
.nrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.nrow b{display:block;font:700 34px/1 var(--serif);font-variant-numeric:tabular-nums}.nrow small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.nrow .r{text-align:end}
.pills{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin:10px 0}.pills .ok{color:var(--mint)}.pills .mid{color:var(--gold)}.pills .bad{color:var(--bad)}
.nbtn{display:flex;gap:8px}.nbtn .btn{flex:1;min-height:46px;padding:0 10px;font-size:15px}
#sug{position:fixed;z-index:34;inset-inline:0;bottom:calc(var(--nbh,150px) + var(--safeB));background:var(--panel);border-top:3px solid var(--gold);padding:12px 16px}
#sug .it{border:0}
#toast{position:fixed;z-index:80;inset-inline:16px;bottom:calc(var(--sh) + 78px);display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--paper);color:var(--ink);padding:12px 16px;border-radius:var(--r);font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto;display:flex;gap:14px;align-items:center;max-width:540px}
#toast button{color:var(--toastbtn);font-weight:800}
#modal{position:fixed;z-index:90;inset:0;background:rgba(5,9,15,.75);display:grid;place-items:center;padding:16px}
#modal .box{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:6px 18px 18px;width:100%;max-width:460px;max-height:86vh;overflow:auto}
/* intro */
#intro{position:fixed;z-index:100;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(18px + var(--safeT)) 22px calc(26px + var(--safeB));background:linear-gradient(180deg,rgba(13,22,32,.8) 0%,rgba(13,22,32,.05) 32%,rgba(13,22,32,.1) 50%,rgba(13,22,32,.94) 84%);transition:opacity .9s}
#intro.bg{background:radial-gradient(130% 90% at 15% 0%,#1d3047,#0d1620 70%)}
#intro.out{opacity:0;pointer-events:none}
.in-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);direction:ltr}
.skip{color:var(--paper);text-decoration:underline;text-underline-offset:4px;min-height:40px;font-size:14px}
.in-main h1{font:900 clamp(60px,20vw,176px)/.92 var(--serif);margin:0 0 14px;letter-spacing:-.02em}
.in-main h1 .ln{display:inline-block;overflow:hidden;direction:ltr;padding-bottom:.12em}
.in-main h1 .ch{display:inline-block}
.in-main .sub{font:500 22px/1.35 var(--serif);color:var(--gold);margin-bottom:10px}
.in-main p{max-width:480px;font-size:16.5px;color:#cdd6e2}

function applyTheme(){const th=effTheme();document.documentElement.dataset.theme=th;

async function getStyle(th){if(!RAWSTYLE){for(const u of STYLES){try{const r=await fetch(u);if(r.ok){RAWSTYLE=await r.json();break}}catch(e){}}}
 if(!RAWSTYLE)throw new Error('style');const st=JSON.parse(JSON.stringify(RAWSTYLE));return th==='dark'?nightify(st):dayify(st)}
let swapTok=0;
async function swapStyle(){const th=effTheme();if(!map||th===mapTheme)return;const tok=++swapTok;let st;try{st=await getStyle(th)}catch(e){return}
 if(tok!==swapTok)return;mapTheme=th;map.once('style.load',()=>{try{setupLayers();if(S.trip&&S.trip.route)setSrc('route',S.trip.route.coords);updateMeCone&&updateMeCone()}catch(e){console.error(e)}});
 map.setStyle(st,{diff:false})}
function dayify(st){for(const l of st.layers){const id=l.id,ty=l.type;l.paint=l.paint||{};const p=l.paint;
  if(ty==='fill-extrusion'){l.layout=l.layout||{};l.layout.visibility='none'}
  else if(ty==='fill'&&!/^building/.test(id)){if(/water/.test(id)){p['fill-color']='#9ccdf0';delete p['fill-pattern']}else if(/park|wood|grass|green|forest/.test(id)){p['fill-color']='#bfe0a6';delete p['fill-pattern']}}
  else if(ty==='line'&&/^waterway|water/.test(id)&&!/boundary/.test(id))p['line-color']='#8fc3ea'}
 return st}
function nightify(st){for(const l of st.layers){const id=l.id,ty=l.type;l.paint=l.paint||{};const p=l.paint;
  if(ty==='background')p['background-color']='#0f1722';
  else if(ty==='fill-extrusion'){l.layout=l.layout||{};l.layout.visibility='none'}
  else if(ty==='fill'){if(/^building/.test(id)){l.layout=l.layout||{};l.layout.visibility='none'}
   else if(/water/.test(id))p['fill-color']='#123a63';else if(/park|wood|grass|green|forest|landcover/.test(id))p['fill-color']='#143d2d';else p['fill-color']='#111c2a';delete p['fill-pattern'];delete p['fill-outline-color']}
  else if(ty==='line'){if(/water/.test(id))p['line-color']='#1d4570';else if(/boundary|admin/.test(id))p['line-color']='#3a4b63';else if(/casing/.test(id))p['line-color']='#0c141e';else if(/path|pedestrian|footway|steps/.test(id))p['line-color']='#5d86b4';else if(/rail|transit/.test(id))p['line-color']='#26354a';else p['line-color']='#3a5578'}
  else if(ty==='symbol'){p['text-color']='#b4c4d8';p['text-halo-color']='#0d1520';p['text-halo-width']=1.2;p['icon-opacity']=.5}}
 return st}
function makeBeacons(){let camera,scene,renderer,groups={},t0=performance.now();
 const mk=(col,op)=>new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false});
 return {id:'beacons3d',type:'custom',renderingMode:'3d',
  onAdd(m,gl){camera=new THREE.Camera();scene=new THREE.Scene();
   renderer=new THREE.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:true});renderer.autoClear=false;
   A.forEach(a=>{const g=new THREE.Group();
    const pil=new THREE.Mesh(new THREE.CylinderGeometry(4,7,1,16,1,true),mk(0xF1C777,.45));pil.name='pil';pil.position.y=.5;g.add(pil);
    const orb=new THREE.Mesh(new THREE.SphereGeometry(9,16,12),mk(0xFFE3A6,.9));orb.name='orb';g.add(orb);
    const ring=new THREE.Mesh(new THREE.RingGeometry(14,17,48),mk(0xF1C777,.6));ring.rotation.x=-Math.PI/2;ring.position.y=1;ring.name='ring';g.add(ring);
    g.visible=false;scene.add(g);groups[a.id]=g})},
  render(gl,arg){if(S.quality==='perf'||!S.mapOK)return;const mat=(arg&&arg.defaultProjectionData)?arg.defaultProjectionData.mainMatrix:arg;
   const tt=(performance.now()-t0)/1000;const rotX=new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1,0,0),Math.PI/2);
   const dests=new Set(S.trip?S.trip.stops.map(s=>s.id):[]);
   for(const a of A){const g=groups[a.id];if(!g)continue;
    const sel=S.sel===a.id,dst=dests.has(a.id),H=sel?210:dst?150:70,sc=sel?1.6:1;
    const col=dst?0x5EE7C4:a.k?0x59A8FF:a.h?0xFF6FA8:0xF1C777;
    g.children.forEach(c=>c.material.color.setHex(c.name==='orb'?(sel?0xffffff:dst?0xbffbe9:0xFFE3A6):col));
    const pil=g.getObjectByName('pil'),orb=g.getObjectByName('orb'),ring=g.getObjectByName('ring');
    pil.scale.set(sc,H,sc);pil.position.y=H/2;orb.position.y=H+8;orb.scale.setScalar(sc*(1+.12*Math.sin(tt*3)));
    const k=1+((tt*.6+A.indexOf(a)*.13)%1)*1.6;ring.scale.set(k*sc,k*sc,1);ring.material.opacity=.7*(1-(k-1)/1.6);
    const mc=maplibregl.MercatorCoordinate.fromLngLat([a.lon,a.lat],0),s=mc.meterInMercatorCoordinateUnits();
    const l=new THREE.Matrix4().makeTranslation(mc.x,mc.y,mc.z).scale(new THREE.Vector3(s,-s,s)).multiply(rotX);
    camera.projectionMatrix=new THREE.Matrix4().fromArray(mat).multiply(l);
    g.visible=true;renderer.resetState?renderer.resetState():renderer.state.reset();renderer.render(scene,camera);g.visible=false}
   map.triggerRepaint()}}}

 else body=`<div class="prog"><i style="width:${prog}%"></i></div>
 <div class="nrow"><div><b>${fmtD(rem)}</b><small>${t('nRemain')} · ${esc(nm(T0.stops[N.li]))}</small></div><div class="r"><b>${fmtT(r.time*(rem/(r.total||1)))}</b><small>${t('nEta')} ${eta.toLocaleTimeString(S.lang==='he'?'he-IL':'en-GB',{hour:'2-digit',minute:'2-digit'})}</small></div></div>
 <div class="pills"><span class="${q[0]}">${t(q[1])}${S.user&&S.user.src==='sim'?' · SIM':''}</span><span>${navigator.onLine?t('online'):t('offline')}</span><span>${r.via==='cached'?t('viaCached'):esc(r.provider.split(' ')[0])}</span></div>
 <div class="nbtn">${N.follow?'':`<button class="btn" data-act="navRecenter">${ic('locate-fixed','⌖')} ${t('nRecenter')}</button>`}<button class="btn" data-act="navPause">${N.paused?ic('play','▶')+' '+t('nResume'):ic('pause','❚❚')+' '+t('nPause')}</button><button class="btn danger" data-act="navEnd">${ic('square','■')} ${t('nEnd')}</button></div>`;
 $('#navbar').innerHTML=body;hydrateIcons();setNavVars()}
function maybeSuggest(){if(N.state!=='navigating'||!N.route||N.sugA||Date.now()-N.lastSug<CFG.discoverGapMs||(N.dNext||0)<80)return;
 const ex=S.trip.stops.map(s=>s.id);const c=suggest(N.route,ex).filter(s=>project(N.route,[s.a.lon,s.a.lat]).along>(N.pr?N.pr.along:0))[0];if(!c)return;
 N.lastSug=Date.now();N.sugA=c.a;const el=$('#sug');
 el.innerHTML=`<div class="it" style="border:0"><div class="im" style="padding:0 0 10px">${thumb(c.a)}<span class="tx2"><span class="nm" style="font-size:19px">${esc(nm(c.a))}</span><span class="sb">${c.off<60?t('sugOn'):t('sugNear',{m:Math.round(c.off)})}</span><span class="sb">${t('sugExtra',{n:c.extra})}</span></span></div></div>
 <div class="row2" style="margin:0"><button class="btn gold" data-act="sugAdd">${ic('plus','+')} ${t('add')}</button><button class="btn" data-act="sugView">${t('view')}</button><button class="btn" data-act="sugDismiss">${t('dismiss')}</button></div>`;hydrateIcons();el.hidden=false;mo(el,{opacity:[0,1],transform:['translateY(30px)','translateY(0px)']},{duration:.5})}
/* stale GPS watchdog + resume */
setInterval(()=>{if(N.active&&!S.demo&&!N.paused&&['navigating'].includes(N.state)&&Date.now()-S.lastFix>12000){setNav('poorGps')}},4000);
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&N.active){try{if(navigator.wakeLock&&!N.wake)N.wake=await navigator.wakeLock.request('screen')}catch(e){}
 if(!S.demo)try{await locateOnce()}catch(e){}updateNavUI()}});
/* ============================ demo walker (always labeled) ============================ */
let sim=null;
function simStart(from){simStop();const r=N.route;sim={along:0,pos:r.coords[0],dev:false,timer:setInterval(simStep,1000)};simStep()}
function simStop(){if(sim){clearInterval(sim.timer);sim=null}}
function simReanchor(){if(!sim||!N.route)return;sim.along=0;sim.dev=false;sim.pos=N.route.coords[0]}
function simStep(){if(!sim||!N.route||N.paused)return;
 if(!sim.dev&&!['offRoute','recalculating','arrived'].includes(N.state)){sim.along+=1.35*S.simSpeed;const q=pointAt(N.route,sim.along);sim.pos=q.pt;sim.hdg=q.hdg}
 onPos({lat:sim.pos[1],lon:sim.pos[0],acc:8,hdg:sim.hdg,spd:1.4,ts:Date.now(),src:'sim'})}
function simDeviate(){if(!sim)return;sim.pos=offsetPt(sim.pos,90,(sim.hdg||0)+90);sim.dev=true;simStep()}
/* ============================ intro / boot ============================ */
function updateIntroStatus(){const st=$('#ldst');if(!st)return;st.textContent=S.introState==='ready'?t('ld1',{n:A.length}):S.introState==='fail'?t('ldFail'):t('ld0')}
function setProg(p){const f=$('#ldbar');if(!f)return;f.style.width=p+'%';const b=document.querySelectorAll('#intro .track b');if(b[0])b[0].classList.toggle('on',p>=6);if(b[1])b[1].classList.toggle('on',p>=50);if(b[2])b[2].classList.toggle('on',p>=100)}
function enterApp(){if(S.entered)return;S.entered=true;stopSpin();Object.values(markers).forEach(m=>m.pin.classList.add('in'));
 $('#intro').classList.add('out');setTimeout(()=>{const x=$('#intro');x&&x.remove()},1000);
 mo('#top',{opacity:[0,1],transform:['translateY(-40px)','translateY(0px)']},{duration:.7,delay:.35});
 mo('#chips .chip',{opacity:[0,1],transform:['translateX(14px)','translateX(0px)']},{delay:stag(.04,{startDelay:.6}),duration:.5});
 mo('#sheet',{opacity:[0,1],transform:['translateY(70px)','translateY(0px)']},{duration:.8,delay:.45});
 mo('#fabs .fab',{opacity:[0,1],transform:['scale(.5)','scale(1)']},{delay:stag(.07,{startDelay:.9}),duration:.5,ease:[.2,1.3,.3,1]});
 if(map&&S.mapOK)map.flyTo({center:BP,zoom:13.4,pitch:S.quality==='perf'?40:58,bearing:S.northUp?0:-18,duration:dur(3200),padding:camPad(),essential:false});
 render();setTimeout(prefetchWiki,1500)}
(async function boot(){
 S.entered=false;applyTheme();applyLang();applySnap();render();updateIntroStatus();S.entered=undefined;
 const tt=$('#ititle');if(tt&&!tt.dataset.done){tt.dataset.done=1;tt.innerHTML=[...tt.textContent].map(c=>`<span class="ch">${c}</span>`).join('')}
 if(GS()){gsap.from('#ititle .ch',{yPercent:112,duration:1.15,ease:'power4.out',stagger:.055,delay:.15});
  gsap.from(['#intro .in-top','.in-main .sub','.in-main p','#intro .in-bot'],{opacity:0,y:16,duration:.9,stagger:.14,delay:.75,ease:'power3.out',clearProps:'transform,opacity'})}
 let p=6;setProg(p);const iv=setInterval(()=>{p=Math.min(88,p+5);setProg(p)},400);
 const ok=await initMap();clearInterval(iv);setProg(100);
 S.introState=ok&&S.mapOK?'ready':'fail';updateIntroStatus();$('#goBtn').disabled=false;
 if(ok&&S.mapOK){$('#intro').classList.remove('bg');spin()}
})();
